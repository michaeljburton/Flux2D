[workspace]
resolver = "3"
members = [
    "crates/flux2d-core",
    "crates/flux2d-render",
    "crates/flux2d-physics",
    "crates/flux2d-fx",
    "crates/flux2d-audio",
    "crates/flux2d",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
repository = "https://github.com/michaeljburton/flux2d"

[workspace.dependencies]
flux2d-core = { path = "crates/flux2d-core", default-features = false }
flux2d-render = { path = "crates/flux2d-render" }
flux2d-physics = { path = "crates/flux2d-physics" }
flux2d-fx = { path = "crates/flux2d-fx" }
flux2d-audio = { path = "crates/flux2d-audio" }
wgpu = "30"
winit = "0.30"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
pollster = "1"
rayon = "1.12"
log = "0.4"
env_logger = "0.11"
gilrs = "0.11"
kira = { version = "0.12", default-features = false, features = ["cpal", "ogg", "vorbis", "wav", "pcm", "mp3", "flac"] }
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }
ab_glyph = "0.2"
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracy-client = "0.19"

[profile.release]
debug = "line-tables-only"
codegen-units = 1
lto = "thin"

# Dependencies (image decoding, wgpu validation) optimised even in dev builds,
# so `cargo run` without --release is still usable.
[profile.dev.package."*"]
opt-level = 3
