[workspace]
resolver = "3"
members = ["crates/flux2d-core", "crates/flux2d-render", "crates/flux2d"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
repository = "https://github.com/michaeljburton/flux2d"

[workspace.dependencies]
flux2d-core = { path = "crates/flux2d-core" }
flux2d-render = { path = "crates/flux2d-render" }
wgpu = "30"
winit = "0.30"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
pollster = "1"
rayon = "1.12"
log = "0.4"
env_logger = "0.11"

[profile.release]
debug = "line-tables-only"
codegen-units = 1
lto = "thin"

# Dependencies (image decoding, wgpu validation) optimised even in dev builds,
# so `cargo run` without --release is still usable.
[profile.dev.package."*"]
opt-level = 3
