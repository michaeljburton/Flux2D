[package]
name = "flux2d"
description = "Flux2D: a 2D game engine built for very large numbers of sprites"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["gamepad", "ecs"]
# Gamepads through gilrs.
gamepad = ["flux2d-core/gamepad"]
# bevy_ecs, re-exported as `flux2d::ecs`.
ecs = ["dep:bevy_ecs"]
# Tracy profiler zones round the loop's phases (and your own `profile_scope!`s).
profile = ["flux2d-core/profile"]

[dependencies]
flux2d-core = { workspace = true, default-features = false }
flux2d-render.workspace = true
flux2d-physics.workspace = true
flux2d-fx.workspace = true
flux2d-audio.workspace = true
bevy_ecs = { workspace = true, optional = true }
wgpu.workspace = true
winit.workspace = true
glam.workspace = true
log.workspace = true
env_logger.workspace = true
pollster.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rayon.workspace = true

[[example]]
name = "shooter"
required-features = ["ecs"]
